<!DOCTYPE html>
<html lang="hi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ViralClip AI</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f5fb;--card:#fff;--tx:#17151f;--mu:#6b6880;--ac:#6c3df4;--bd:#e4e1f0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f0e17;--card:#1a1826;--tx:#f1f0f8;--mu:#9a97b0;--ac:#8b66ff;--bd:#2c2940}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,sans-serif;padding:16px;max-width:560px;margin:auto}
h1{font-size:22px;margin:4px 0 2px}p.s{color:var(--mu);margin:0 0 16px;font-size:14px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px}
label{font-size:13px;color:var(--mu);display:block;margin:10px 0 6px}
input[type=text]{width:100%;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:15px}
.ch{display:flex;flex-wrap:wrap;gap:8px}
.ch button{padding:9px 13px;border-radius:20px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:14px}
.ch button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.row{display:flex;justify-content:space-between;align-items:center;padding:8px 0}
.row input{width:22px;height:22px;accent-color:var(--ac)}
.go{width:100%;padding:14px;border:0;border-radius:14px;background:var(--ac);color:#fff;font-size:16px;font-weight:600}
.pv{height:90px;border-radius:12px;background:linear-gradient(135deg,#2b2350,#6c3df4);display:flex;align-items:flex-end;justify-content:center;padding-bottom:12px;margin-top:8px}
.cap{font-weight:800;font-size:18px;color:#fff}
.bar{height:8px;border-radius:4px;background:var(--bd);overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--ac);transition:width .4s}
.sc{display:flex;gap:12px;align-items:center}
.ring{min-width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;color:#fff}
.m{font-size:12px;color:var(--mu);margin-top:6px;display:flex;gap:10px;flex-wrap:wrap}
.hide{display:none}.note{font-size:12px;color:var(--mu);text-align:center;margin-top:8px}
</style></head><body>
<h1>🎬 ViralClip AI</h1>
<p class="s">Long video → viral short clips, AI rating ke saath</p>

<div id="setup">
<div class="c"><label style="margin-top:0">Server URL</label><input type="text" id="sv" placeholder="http://192.168.1.5:8000"><label>YouTube link</label>
<input type="text" id="url" placeholder="https://youtube.com/watch?v=...">
<label>Resolution</label><div class="ch" id="res"></div>
<label>Aspect ratio</label><div class="ch" id="asp"></div>
<label>Caption style</label><div class="ch" id="sty"></div>
<div class="pv"><span class="cap" id="pvc">Ye viral hoga</span></div></div>
<div class="c">
<div class="row"><span>Auto captions</span><input type="checkbox" id="ac" checked></div>
<div class="row"><span>Auto B-roll</span><input type="checkbox" id="br" checked></div>
<div class="row"><span>Emoji &amp; hook title</span><input type="checkbox" id="em" checked></div>
<label>Clip length</label><div class="ch" id="len"></div></div>
<button class="go" id="go">✨ Viral clips dhundo</button>
</div>

<div id="prog" class="c hide"><b id="pt">Analyzing…</b><div class="bar" style="margin-top:10px"><i id="pb"></i></div></div>
<div id="err" class="c hide" style="color:#e5484d"></div><div id="out" class="hide"></div>


<script>
const $=id=>document.getElementById(id);
const sel={res:'1080p',asp:'9:16',sty:'Bold Pop',len:'30–60s'};
function chips(id,arr,k){const e=$(id);arr.forEach(v=>{const b=document.createElement('button');b.textContent=v;if(v===sel[k])b.className='on';b.onclick=()=>{sel[k]=v;[...e.children].forEach(x=>x.className='');b.className='on';if(k==='sty')sty()};e.appendChild(b)})}
chips('res',['720p','1080p','1440p','4K'],'res');
chips('asp',['9:16','1:1','4:5','16:9'],'asp');
chips('sty',['Bold Pop','Karaoke','Minimal','Neon'],'sty');
chips('len',['15–30s','30–60s','60–90s'],'len');
function sty(){const c=$('pvc'),s=sel.sty;
c.style.cssText='';
if(s==='Bold Pop'){c.style.cssText='text-transform:uppercase;-webkit-text-stroke:1px #000;color:#ffe600'}
if(s==='Karaoke'){c.innerHTML='Ye <span style="color:#ffe600">viral</span> hoga'}else c.textContent='Ye viral hoga';
if(s==='Minimal'){c.style.cssText='font-weight:500;font-size:15px;background:rgba(0,0,0,.55);padding:3px 8px;border-radius:6px'}
if(s==='Neon'){c.style.cssText='color:#fff;text-shadow:0 0 8px #0ff,0 0 16px #f0f'}}
sty();
const titles=['Sabse bada mistake jo log karte hain','Ye 1 trick sab kuch badal degi','Kisi ne nahi bataya tha ye sach','Shocking reveal: asli reason','Beginners ke liye golden rule','Ye galti mat karna','Story jo sabko hila degi'];
function h(s){let x=0;for(const c of s)x=(x*31+c.charCodeAt(0))>>>0;return()=>(x=(x*1664525+1013904223)>>>0)/4294967296}
function fmt(t){return Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0')}
const esc=x=>String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
try{$('sv').value=localStorage.getItem('sv')||''}catch(e){}
function fail(m){$('prog').classList.add('hide');$('setup').classList.remove('hide');$('err').textContent='⚠ '+m;$('err').classList.remove('hide')}
$('go').onclick=async()=>{
const u=$('url').value.trim(),sv=$('sv').value.trim().replace(/\/+$/,'');
$('err').classList.add('hide');
if(!/^https?:\/\//.test(sv)){$('sv').style.borderColor='#e5484d';return}
if(!/youtu\.?be/.test(u)){$('url').style.borderColor='#e5484d';return}
try{localStorage.setItem('sv',sv)}catch(e){}
$('setup').classList.add('hide');$('prog').classList.remove('hide');$('out').classList.add('hide');$('pb').style.width='3%';$('pt').textContent='Server se connect…';
try{
const r=await fetch(sv+'/jobs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:u,resolution:sel.res,aspect:sel.asp,style:sel.sty,captions:$('ac').checked,broll:$('br').checked,length:sel.len})});
if(!r.ok)throw new Error('Server error '+r.status);
const {id}=await r.json();
for(;;){await new Promise(z=>setTimeout(z,2000));
const j=await(await fetch(sv+'/jobs/'+id)).json();
$('pt').textContent=j.status;$('pb').style.width=Math.max(3,j.progress)+'%';
if(j.error)throw new Error(j.error);
if(j.done){show(j,sv);return}}
}catch(e){fail(e.message==='Failed to fetch'?'Server se connect nahi hua. URL aur Wi-Fi check karo.':e.message)}};
function show(j,sv){
const col=x=>x>=80?'#1fa86b':x>=65?'#e8a317':'#e5484d';
$('prog').classList.add('hide');
$('out').innerHTML='<div class="c"><b>'+j.clips.length+' clips ready</b></div>'+
j.clips.map((c,i)=>{const m=c.scores||{};return '<div class="c"><div class="sc"><div class="ring" style="background:'+col(c.score)+'">'+Math.round(c.score)+'</div><div><b>'+($('em').checked?'🔥 ':'')+esc(c.title)+'</b><div class="m"><span>#'+(i+1)+(i==0?' Best pick':'')+'</span><span>'+fmt(c.start)+' → '+fmt(c.end)+'</span></div></div></div>'+
'<div class="m">'+Object.entries(m).map(([k,v])=>'<span>'+esc(k)+' '+esc(v)+'</span>').join('')+'</div>'+
'<video controls playsinline preload="metadata" style="width:100%;border-radius:12px;margin-top:10px;max-height:420px;background:#000" src="'+esc(sv+c.url)+'"></video>'+
'<a href="'+esc(sv+c.url)+'" download="clip'+(i+1)+'.mp4" target="_blank"><button class="go" style="margin-top:10px;padding:10px;font-size:14px">⬇ Download clip</button></a></div>'}).join('')+
'<button class="go" style="background:var(--card);color:var(--tx);border:1px solid var(--bd)" onclick="location.reload()">← Naya video</button>';
$('out').classList.remove('hide')}
function fmt(t){return Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0')}
</script></body></html>
